<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@200;300&display=swap">
<style>
  body { background: #f3ede7; margin: 0; display: grid; place-items: center; height: 100vh; }
  .lockup {
    font-family: 'Montserrat', sans-serif;
    font-size: 60px;
    font-weight: 200;
    letter-spacing: 0.12em;
    color: transparent;
    -webkit-text-fill-color: transparent;
    background-image: url('/assets/marvelous-salon-hero.png');
    background-size: cover;
    background-position: center;
    background-attachment: fixed;
    background-clip: text;
    -webkit-background-clip: text;
  }
  .lambda {
    display: inline-block;
    clip-path: polygon(0% 0%, 100% 0%, 100% 100%, 75% 100%, 50% 24%, 25% 100%, 0% 100%);
    -webkit-clip-path: polygon(0% 0%, 100% 0%, 100% 100%, 75% 100%, 50% 24%, 25% 100%, 0% 100%);
  }
</style>
</head>
<body>
  <div class="lockup">
    M<span class="lambda">A</span>RVELOUS
  </div>
</body>
</html>
